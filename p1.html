<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Image Page</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        /* styles/style.css */
        .dice-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); /* semitransparente */
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .dice-modal.active {
            display: flex;
        }
        .image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .responsive-image {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            margin: 0 auto;
        }
        .mistery-fade {
            display: none;
            position: absolute;
            left: 50%;
            top: -20%; /* O prueba con top: -2% para subirlo aún más */
            transform: translateX(-50%);
            text-align: center;
            font-size: 1.3rem;
            color: #111;
            font-weight: bold;
            z-index: 2;
            cursor: pointer;
            background: none;
            box-shadow: none;
            padding: 0;
        }
        .mistery-fade span {
            display: block;
            margin-bottom: 22px; /* Añade espacio extra entre texto y triángulo */
        }
        .mistery-fade.visible {
            display: block;
            animation: fadein 0.7s;
        }
        @keyframes fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .triangle {
            margin: 18px auto 0 auto;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 22px solid #222;
            animation: blink 1s steps(2, start) infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div id="main-content" style="opacity:0;transition:opacity 1s;">
        <div class="image-container">
            <img src="images/mainphoto.jpeg" alt="Main Image" class="responsive-image">
            <div id="mistery-text" class="mistery-fade">
                <span>¿Cómo ha llegado esto aquí...?</span>
                <div class="triangle"></div>
            </div>
        </div>
        <div id="dice-modal" class="dice-modal">
            <div class="dice-box">
                <span class="dice-text">Toca para tirar</span>
                <img src="images/mp-dice-short.gif" alt="Dado girando" class="dice-gif" id="dice-gif">
            </div>
        </div>
        <div id="gift-modal" class="dice-modal">
            <div class="dice-box">
                <span class="dice-text">ÁBRE TU REGALO</span>
                <img src="images/present.gif" alt="Regalo animado" style="margin-top:18px;max-width:120px;display:block;">
            </div>
        </div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('main-content').style.opacity = '1';
                // Mostrar el texto misterioso a los 3s
                setTimeout(() => {
                    document.getElementById('mistery-text').classList.add('visible');
                }, 3000);
            }, 100); // Pequeño retardo para transición suave

            // Al tocar el texto misterioso, mostrar el dado
            document.getElementById('mistery-text').addEventListener('click', () => {
                document.getElementById('mistery-text').style.display = 'none';
                document.getElementById('dice-modal').classList.add('active');
            });

            // Al tocar el dado, mostrar el regalo
            document.querySelector('#dice-modal .dice-box').addEventListener('click', () => {
                document.getElementById('dice-modal').classList.remove('active');
                document.getElementById('gift-modal').classList.add('active');
                // Redirigir a p2.html tras 3 segundos
                setTimeout(() => {
                    window.location.href = 'p2.html';
                }, 10000);
            });
        });
    </script>
</body>
</html>
