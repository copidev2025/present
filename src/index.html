<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio Misterioso</title>
    <style>
        body {
            background: #fff;
            margin: 0;
            min-height: 100vh;
        }
        #frase {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 1.5rem;
            color: #222;
            cursor: pointer;
            user-select: none;
            max-width: 90vw;
        }
        .triangle {
            margin: 28px auto 0 auto;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 22px solid #222;
            animation: blink 1s steps(2, start) infinite;
            visibility: visible;
        }
        .triangle.invisible {
            visibility: hidden;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .fade-text.visible {
            opacity: 1;
            transition: opacity 0.4s;
        }
        .fade-text {
            opacity: 0;
            transition: opacity 0.4s;
        }
        .dice-box {
            background: #f8f8f8; /* Tonalidad blanquecina del gif */
            border-radius: 24px;
            box-shadow: 0 2px 18px rgba(0,0,0,0.18);
            padding: 32px 24px 24px 24px;
            text-align: center;
            z-index: 10;
        }
        #dice-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(0,0,0,0.45);
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="frase" class="fade-text">
        <span id="frase-text"></span>
        <div id="triangle" class="triangle"></div>
    </div>
    <img id="mainphoto" src="images/mainphoto.jpeg" alt="Main Image" style="display:none;opacity:0;transition:opacity 1s;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:90vw;max-height:90vh;z-index:10;">
    <script>
        const frases = [
            "Has desbloqueado un evento especial...",
            "Hoy no es un día cualquiera...",
            "Los astros se han alineado, las puertas del inventario se abren...",
            "¡Feliz cumpleaños, Adela María! 🎉"
        ];
        let idx = 0;
        const fraseDiv = document.getElementById('frase');
        const fraseText = document.getElementById('frase-text');
        const triangle = document.getElementById('triangle');

        function mostrarFrase(i) {
            fraseDiv.classList.remove('visible');
            // Deshabilita avance en el último texto hasta que aparezca el triángulo
            if (i === frases.length - 1) {
                fraseDiv.removeEventListener('click', avanzarFrase);
            }
            setTimeout(() => {
                fraseText.textContent = frases[i];
                fraseDiv.classList.add('visible');
                if (i < frases.length - 1) {
                    triangle.classList.remove('invisible');
                } else {
                    triangle.classList.add('invisible');
                    // Habilita avance solo cuando aparece el triángulo (tras 1.5s)
                    setTimeout(() => {
                        if (idx === frases.length - 1) {
                            triangle.classList.remove('invisible');
                            fraseDiv.addEventListener('click', avanzarFrase);
                        }
                    }, 1500);
                }
            }, 400);
        }

        function avanzarFrase() {
            fraseDiv.classList.remove('visible');
            idx++;
            if (idx < frases.length) {
                setTimeout(() => {
                    mostrarFrase(idx);
                }, 400);
            } else {
                // Redirige a p1.html tras la última frase
                setTimeout(() => {
                    window.location.href = 'p1.html';
                }, 400);
            }
        }

        // Iniciar
        mostrarFrase(idx);
        fraseDiv.addEventListener('click', avanzarFrase);
    </script>
</body>
</html>
